version: '3.8'

services:
  # PrivFed Backend API
  privfed-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privfed-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PYTHONPATH=/app
    volumes:
      - ./backend/configs:/app/configs:ro
      - ./dataset:/app/dataset:ro
      - privfed-logs:/app/logs
      - privfed-results:/app/results
      - privfed-models:/app/models
      - privfed-experiments:/app/experiments
    networks:
      - privfed-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: privfed-redis
    ports:
      - "6379:6379"
    volumes:
      - privfed-redis-data:/data
    networks:
      - privfed-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for metadata and results storage
  postgres:
    image: postgres:15-alpine
    container_name: privfed-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=privfed
      - POSTGRES_USER=privfed_user
      - POSTGRES_PASSWORD=privfed_secure_password_2024
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - privfed-postgres-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - privfed-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privfed_user -d privfed"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: privfed-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - privfed-logs:/var/log/nginx
    networks:
      - privfed-network
    restart: unless-stopped
    depends_on:
      - privfed-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: privfed-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - privfed-prometheus-data:/prometheus
    networks:
      - privfed-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: privfed-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=privfed_admin_2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - privfed-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - privfed-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Jupyter Lab for research and development
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    container_name: privfed-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=privfed_jupyter_token_2024
    volumes:
      - ./backend:/home/jovyan/backend:ro
      - ./dataset:/home/jovyan/dataset:ro
      - ./notebooks:/home/jovyan/notebooks
      - privfed-jupyter-work:/home/jovyan/work
    networks:
      - privfed-network
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  privfed-logs:
    driver: local
  privfed-results:
    driver: local
  privfed-models:
    driver: local
  privfed-experiments:
    driver: local
  privfed-redis-data:
    driver: local
  privfed-postgres-data:
    driver: local
  privfed-prometheus-data:
    driver: local
  privfed-grafana-data:
    driver: local
  privfed-jupyter-work:
    driver: local

# Custom network
networks:
  privfed-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16